name: Focus API web tests
on:
  push:
    branches:
      - feat/focus-history-reward
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
        working-directory: web
      - name: Run API unit tests
        run: npm test
        working-directory: web
      - name: Validate Next.js build and TypeScript types
        run: npm run build
        working-directory: web
