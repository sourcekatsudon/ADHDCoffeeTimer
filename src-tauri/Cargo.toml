[package]
name = "ambient-pomodoro"
version = "0.2.1"
description = "A quiet, automatic desktop focus timer"
authors = ["sourcekatsudon"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sourcekatsudon/ADHDCoffeeTimer"

[lib]
name = "ambient_pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
